<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,Arial}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white}
header{
  padding:20px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between
}
header h1{font-size:2.2rem}
header input{
  flex:1;min-width:200px;
  padding:10px 18px;
  border-radius:30px;border:none;outline:none
}

#gallery{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px
}
.card{
  background:rgba(255,255,255,0.08);
  padding:10px;border-radius:18px;
  cursor:pointer;transition:.3s
}
.card:hover{transform:translateY(-6px)}
.card img{
  width:100%;height:180px;
  object-fit:cover;border-radius:15px
}
.card span{
  display:block;text-align:center;
  margin-top:8px;color:cyan;font-weight:bold
}

.empty{text-align:center;grid-column:1/-1;opacity:.8}

#viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;z-index:99
}
#viewer img{
  max-width:90%;
  max-height:80%;
  border-radius:15px
}
.viewer-controls{
  position:absolute;top:20px;right:20px;
  display:flex;gap:10px
}
.viewer-controls a,
.viewer-controls button{
  padding:10px 15px;border:none;
  border-radius:20px;
  background:linear-gradient(45deg,cyan,dodgerblue);
  font-weight:bold;cursor:pointer;color:black
}

footer{
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.08)
}
</style>
</head>

<body>

<header>
  <h1>Wallpaper Hub</h1>
  <input id="search" placeholder="Search wallpaper...">
</header>

<div id="gallery"></div>

<!-- Viewer -->
<div id="viewer" onclick="closeViewer()">
  <div class="viewer-controls" onclick="event.stopPropagation()">
    <a id="downloadBtn" download>Download</a>
    <button onclick="closeViewer()">❌</button>
  </div>
  <img id="viewerImg">
</div>

<footer>Created by <b>Harshit Parmar</b></footer>

<script>
const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");
const downloadBtn = document.getElementById("downloadBtn");
const search = document.getElementById("search");

/* 🔥 AUTO IMAGE LOADER */
const imageNames = [
  "rohit1.jpg",
  "rohit2.jpg",
  "rohit3.jpg",
  "rohit4.jpg",
  "rohit5.jpg",
  "rohit6.jpg",
  "rohit7.jpg",
  "virat1.jpg",
  "virat2.jpg",
  "virat3.jpg",
  "virat4.jpg",
  "virat5.jfif"
]; 
// 👆 sirf yaha name likho, image folder me paste kar do

function loadImages(){
  gallery.innerHTML="";
  const q = search.value.toLowerCase();

  const filtered = imageNames.filter(n => n.toLowerCase().includes(q));

  if(filtered.length === 0){
    gallery.innerHTML = `<div class="empty">No wallpapers found</div>`;
    return;
  }

  filtered.forEach(name=>{
    gallery.innerHTML += `
      <div class="card" onclick="openViewer('images/${name}')">
        <img src="images/${name}">
        <span>${name}</span>
      </div>
    `;
  });
}

search.oninput = loadImages;

function openViewer(src){
  viewer.style.display="flex";
  viewerImg.src = src;
  downloadBtn.href = src;
  downloadBtn.download = src.split("/").pop();
}
function closeViewer(){
  viewer.style.display="none";
}

loadImages();

/* PWA */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>

</html>
